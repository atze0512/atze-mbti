<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>성인용 MBTI 간이 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분하고 신뢰감 있는 성인 워크숍 도구
   IDEA: 손에 쥐는 응답지 카드 — 한 장씩 넘기는 검사지
   PICTURE: 검사 자체(문항 카드와 5점 척도)가 화면의 주인공, 결과는 네 개의 저울 막대
   COLOUR and TYPE: 흰 바탕, 짙은 잉크, 토마토 #e4572e 강조, 코발트 #2b59c3 보조 / IBM Plex Sans KR
   LAYOUT: 720px 한 칼럼, 상단 진행 막대, 10문항씩 6쪽, 마지막에 결과 */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#121418);--ink:light-dark(#15171c,#eceef2);--mute:light-dark(#5d6270,#a3a8b4);
--line:light-dark(#e3e5ea,#2a2e36);--card:light-dark(#f5f6f8,#1a1d23);--a:#e4572e;--b:light-dark(#2b59c3,#6f93ea);--on:#fff}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:760px;margin:0 auto;padding:clamp(24px,4vw,48px) max(5vw,16px) 64px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 8px;text-wrap:balance}
.lead{color:var(--mute);margin:0 0 20px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
.track{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--a);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-top:6px}
.q{padding:22px 0;border-bottom:1px solid var(--line)}
.q p{margin:0 0 14px;font-size:17px;font-weight:500}
.q p b{color:var(--mute);font-weight:500;margin-right:6px}
.scale{display:grid;grid-template-columns:auto repeat(5,44px) auto;gap:8px;align-items:center;justify-content:center}
.scale span{font-size:13px;color:var(--mute);white-space:nowrap}
.scale button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg);cursor:pointer;padding:0}
.scale button:nth-child(2),.scale button:nth-child(3){border-color:color-mix(in srgb,var(--b) 55%,var(--line))}
.scale button:nth-child(5),.scale button:nth-child(6){border-color:color-mix(in srgb,var(--a) 55%,var(--line))}
.scale button[aria-pressed=true]{background:var(--ink);border-color:var(--ink)}
.scale button:focus-visible,.btn:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.q.miss p{color:var(--a)}
.nav{display:flex;gap:12px;justify-content:space-between;margin-top:28px;flex-wrap:wrap}
.btn{min-height:48px;padding:0 22px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.btn.go{background:var(--a);border-color:var(--a);color:var(--on)}
.btn[disabled]{opacity:.4;cursor:default}
.warn{color:var(--a);font-size:14px;min-height:22px;margin-top:10px}
.type{font-size:clamp(64px,16vw,112px);font-weight:700;line-height:1;letter-spacing:.04em;margin:8px 0}
.nick{font-size:22px;font-weight:700;margin:0 0 18px}
.axis{margin:18px 0}
.axis .lab{display:flex;justify-content:space-between;font-size:15px;font-weight:500;margin-bottom:6px}
.axis .lab em{font-style:normal;color:var(--mute);font-weight:400}
.meter{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--line)}
.meter i{display:block;height:100%}
.meter .l{background:var(--b)}.meter .r{background:var(--a)}
.axis small{display:block;color:var(--mute);font-size:13px;margin-top:4px}
.box{background:var(--card);border-radius:14px;padding:20px 22px;margin-top:24px}
.box h3{margin:0 0 6px;font-size:17px}.box p{margin:0 0 10px}
.note{font-size:13px;color:var(--mute);margin-top:28px}
@media(max-width:520px){.scale{grid-template-columns:repeat(5,44px)}.scale span{display:none}.ends{display:flex!important}}
.ends{display:none;justify-content:space-between;font-size:13px;color:var(--mute);max-width:284px;margin:6px auto 0}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>

  const s=page*PER;let h="";
  for(let i=s;i<s+PER;i++){
    h+=`<div class="q" id="q${i}"><p><b>${i+1}.</b>${Q[i][1]}</p><div class="scale" role="group" aria-label="${i+1}번 응답"><span>전혀 아니다</span>`+
    [1,2,3,4,5].map(v=>`<button type="button" data-i="${i}" data-v="${v}" aria-label="${LBL[v-1]}" aria-pressed="${A[i]===v}"></button>`).join("")+
    `<span>매우 그렇다</span></div><div class="ends"><span>전혀 아니다</span><span>매우 그렇다</span></div></div>`;
  }
  h+=`<div class="nav"><button class="btn" id="prev" ${page?"":"disabled"}>이전</button><button class="btn go" id="next">${page===PAGES-1?"결과 보기":"다음"}</button></div><div class="warn" id="warn"></div>`;
  main.innerHTML=h;prog();
}
function score(){
  return AX.map(([a,b,ka,kb,desc])=>{let pa=0,pb=0;
    Q.forEach((q,i)=>{const v=A[i]-1;if(q[0]===a){pa+=v;pb+=4-v}else if(q[0]===b){pb+=v;pa+=4-v}});
    const pct=Math.round(pa/(pa+pb)*100);
    const win=pa>pb?a:b; /* 동점이면 I·N·F·P (MBTI 관례) */
    return{a,b,ka,kb,desc,pct,win}});
}
function result(){
  document.getElementById("bar").style.display="none";
  const r=score(),t=r.map(x=>x.win).join(""),d=D[t];
  const near=r.filter(x=>Math.abs(x.pct-50)<5);
  main.innerHTML=`<p class="lead" style="margin:0">나의 성격 유형</p><div class="type">${t}</div><p class="nick">${d[0]}</p>`+
  r.map(x=>{const l=x.pct,rr=100-l;const s=Math.max(l,rr);
    return `<div class="axis"><div class="lab"><span>${x.a} ${x.ka} ${l}%</span><em>${x.desc}</em><span>${rr}% ${x.kb} ${x.b}</span></div>
    <div class="meter"><i class="l" style="width:${l}%"></i><i class="r" style="width:${rr}%"></i></div>
    <small>${s<55?"양쪽 성향을 고루 쓰는 편입니다.":s<70?(x.win===x.a?x.ka:x.kb)+" 쪽을 조금 더 선호합니다.":(x.win===x.a?x.ka:x.kb)+" 쪽 선호가 뚜렷합니다."}</small></div>`}).join("")+
  `<div class="box"><h3>이런 사람이에요</h3><p>${d[1]}</p><h3>잘 맞는 일</h3><p>${d[2]}</p><h3>성장 포인트</h3><p style="margin:0">${d[3]}</p></div>`+
  (near.length?`<div class="box"><h3>경계 지표 안내</h3><p style="margin:0">${near.map(x=>x.a+"/"+x.b).join(", ")} 지표는 거의 반반입니다. 상황에 따라 두 성향을 모두 쓰는 편이니, 반대 글자 유형의 설명도 함께 읽어 보세요.</p></div>`:"")+
  `<div class="nav"><button class="btn" id="back">응답 수정</button><button class="btn" id="copy">결과 복사</button><button class="btn go" id="reset">처음부터 다시</button></div><div class="warn" id="warn"></div>`;
  window.scrollTo(0,0);
}
main.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.i){const i=+b.dataset.i;A[i]=+b.dataset.v;
    b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    document.getElementById("q"+i).classList.remove("miss");save();prog();return}
  if(b.id==="prev"){page--;save();render();window.scrollTo(0,0)}
  if(b.id==="next"){const s=page*PER,miss=[];for(let i=s;i<s+PER;i++)if(!A[i])miss.push(i);
    if(miss.length){miss.forEach(i=>document.getElementById("q"+i).classList.add("miss"));
      document.getElementById("warn").textContent="응답하지 않은 문항이 "+miss.length+"개 있습니다.";
      document.getElementById("q"+miss[0]).scrollIntoView({block:"center"});return}
    page++;save();render();window.scrollTo(0,0)}
  if(b.id==="back"){page=PAGES-1;save();render()}
  if(b.id==="reset"){A=new Array(Q.length).fill(0);page=0;save();render();window.scrollTo(0,0)}
  if(b.id==="copy"){const r=score(),t=r.map(x=>x.win).join("");
    const txt="나의 성격 유형: "+t+" ("+D[t][0]+")\n"+r.map(x=>x.a+" "+x.pct+"% / "+x.b+" "+(100-x.pct)+"%").join("\n");
    navigator.clipboard.writeText(txt).then(()=>document.getElementById("warn").textContent="결과를 복사했습니다.",()=>document.getElementById("warn").textContent="복사가 지원되지 않는 환경입니다.")}
});
render();
}
</script>
</body>
</html>
